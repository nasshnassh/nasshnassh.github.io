<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munadi Bot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
            min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
}
    .container {
            text-align: center;
      padding: 40px 20px;
      max-width: 800px;
}
    .bot-icon {
            font-size: 80px;
      margin-bottom: 20px;
}
    h1 {
            font-size: 3em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #e94560, #533483);
              -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
}
    .subtitle {
            font-size: 1.3em;
      color: #a0a0b0;
            margin-bottom: 40px;
}
    .features {
            display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
      }
    .feature {
            background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 30px 20px;
      transition: transform 0.3s;
    }
    .feature:hover { transform: translateY(-5px); }
    .feature-icon { font-size: 40px; margin-bottom: 15px; }
    .feature h3 { margin-bottom: 8px; color: #e94560; }
        .feature p { color: #a0a0b0; font-size: 0.9em; }
          .btn {
            display: inline-block;
      padding: 15px 40px;
      background: linear-gradient(90deg, #e94560, #533483);
              color: #fff;
              text-decoration: none;
      border-radius: 50px;
      font-size: 1.2em;
      font-weight: bold;
      transition: opacity 0.3s;
}
    .btn:hover { opacity: 0.85; }
    footer {
            margin-top: 60px;
      color: #555;
      font-size: 0.85em;
}
  </style>
    </head>
    <body>
      <div class="container">
        <div class="bot-icon">&#129302;</div>
        <h1>Munadi Bot</h1>
        <p class="subtitle">Your Discord Assistant</p>
    <div class="features">
      <div class="feature">
        <div class="feature-icon">&#9889;</div>
        <h3>Fast</h3>
        <p>Quick responses</p>
      </div>
          <div class="feature">
            <div class="feature-icon">&#128274;</div>
            <h3>Secure</h3>
            <p>Safe and reliable</p>
      </div>
      <div class="feature">
        <div class="feature-icon">&#127775;</div>
        <h3>Smart</h3>
        <p>Powerful features</p>
      </div>
        </div>
        <a href="#" class="btn">Add to Discord</a>
        <footer>&copy; 2026 Munadi Bot. All rights reserved.</footer>
  </div>
</body>
    </html>
